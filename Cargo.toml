[package]
# Package "rust-mp", lib "rump": the bare name "rump" is taken on crates.io
# by an unrelated CLI tool, so the package publishes as rust-mp while code
# keeps saying `use rump::...` — the same pattern the cryptography-rs package
# uses for its `cryptography` lib.
name = "rust-mp"
version = "0.2.0"
edition = "2021"
license = "BSD-2-Clause"
authors = ["Darrell Long"]
description = "Multiprecision integer arithmetic implemented from the literature: Knuth Algorithm D division, Montgomery multiplication with a public Montgomery domain, Karatsuba, and deterministic number theory."
repository = "https://github.com/darrelllong/rump"
keywords = ["bignum", "arithmetic", "montgomery", "number-theory"]
categories = ["mathematics", "algorithms"]

[lib]
name = "rump"
path = "src/lib.rs"

[dependencies]
