[package]
# Package "rust-mp", lib "rump": the bare name "rump" is taken on crates.io
# by an unrelated CLI tool, so the package publishes as rust-mp while code
# keeps saying `use rump::...` — the same pattern the cryptography-rs package
# uses for its `cryptography` lib.
name = "rust-mp"
version = "0.3.0"
edition = "2021"
# `u64`/`usize::is_multiple_of` (used throughout) stabilized in 1.87.
rust-version = "1.87"
license = "BSD-2-Clause"
authors = ["Darrell Long"]
description = "Multiprecision integer arithmetic implemented from the literature: Knuth Algorithm D division, a public Montgomery domain, Karatsuba and Toom-Cook multiplication, number theory through Baillie-PSW and exact AKS, GF(2^m), polynomials over Z and F_p with factorization, and integral LLL."
repository = "https://github.com/darrelllong/rump"
keywords = ["bignum", "arithmetic", "montgomery", "number-theory"]
categories = ["mathematics", "algorithms"]

[lib]
name = "rump"
path = "src/lib.rs"

[dependencies]

[features]
# Opt-in drop-time zeroization: BigUint wipes its live limbs on drop, the
# in-place shrink paths wipe abandoned limbs, the exponentiation ladder and
# Montgomery workspaces wipe on exit, and the samplers wipe drawn bytes.
# Uses one audited volatile-write helper (src/scrub.rs), so the crate-wide
# forbid(unsafe_code) relaxes to deny(unsafe_code) under this feature; the
# default build keeps forbid with no exceptions and wipes nothing.
wipe = []
